name: Remind Incomplete DuQuantum Accounts

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inventory is read-only; send issues fresh links and reminders
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - send
      confirm_event:
        description: Type duquantum-2026
        required: true
        type: string
      expected_recipient_count:
        description: Exact count from the latest inventory (required for send)
        required: false
        type: string
      expected_setup_count:
        description: Exact fresh-link count from latest inventory (required for send)
        required: false
        type: string
      expected_signin_count:
        description: Exact sign-in count from latest inventory (required for send)
        required: false
        type: string
      expected_recipient_sha256:
        description: Exact recipient SHA-256 from latest inventory (required for send)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: duquantum-account-reminders
  cancel-in-progress: false

jobs:
  remind:
    name: Preflight exact reminder allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Validate operator confirmation
        env:
          CONFIRM_EVENT: ${{ inputs.confirm_event }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_RECIPIENT_COUNT: ${{ inputs.expected_recipient_count }}
          EXPECTED_SETUP_COUNT: ${{ inputs.expected_setup_count }}
          EXPECTED_SIGNIN_COUNT: ${{ inputs.expected_signin_count }}
          EXPECTED_RECIPIENT_SHA256: ${{ inputs.expected_recipient_sha256 }}
          RECIPIENT_EMAILS: ${{ secrets.DUQUANTUM_INCOMPLETE_ACCOUNT_EMAILS }}
        run: |
          set -euo pipefail
          test "$CONFIRM_EVENT" = "duquantum-2026"
          test -n "$RECIPIENT_EMAILS"
          if [ "$OPERATION" = "send" ]; then
            printf '%s' "$EXPECTED_RECIPIENT_COUNT" | grep -Eq '^[0-9]+$'
            printf '%s' "$EXPECTED_SETUP_COUNT" | grep -Eq '^[0-9]+$'
            printf '%s' "$EXPECTED_SIGNIN_COUNT" | grep -Eq '^[0-9]+$'
            printf '%s' "$EXPECTED_RECIPIENT_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$'
          fi

      - name: Run production-backed reminder preflight
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_USER: ec2-user
          OPERATION: ${{ inputs.operation }}
          EXPECTED_RECIPIENT_COUNT: ${{ inputs.expected_recipient_count }}
          EXPECTED_SETUP_COUNT: ${{ inputs.expected_setup_count }}
          EXPECTED_SIGNIN_COUNT: ${{ inputs.expected_signin_count }}
          EXPECTED_RECIPIENT_SHA256: ${{ inputs.expected_recipient_sha256 }}
          RECIPIENT_EMAILS: ${{ secrets.DUQUANTUM_INCOMPLETE_ACCOUNT_EMAILS }}
        run: |
          set -euo pipefail
          local_recipients="$(mktemp)"
          remote_recipients=".duquantum-reminders-${GITHUB_RUN_ID}.txt"
          cleanup() {
            rm -f -- key.pem "$local_recipients"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$RECIPIENT_EMAILS" > "$local_recipients"
          printf '%s' "$PRIVATE_KEY" > key.pem
          chmod 600 key.pem "$local_recipients"

          scp -i key.pem -o StrictHostKeyChecking=no "$local_recipients" \
            "$EC2_USER@$EC2_IP:$remote_recipients"

          ssh -i key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_IP" \
            bash -s -- "$OPERATION" "$remote_recipients" \
            "$EXPECTED_RECIPIENT_COUNT" "$EXPECTED_SETUP_COUNT" \
            "$EXPECTED_SIGNIN_COUNT" "$EXPECTED_RECIPIENT_SHA256" << 'EOF'
            set -euo pipefail
            operation="$1"
            recipient_file="$2"
            expected_recipient_count="${3:-}"
            expected_setup_count="${4:-}"
            expected_signin_count="${5:-}"
            expected_recipient_sha256="${6:-}"
            case "$recipient_file" in
              .duquantum-reminders-*.txt) ;;
              *) echo "Unsafe recipient file path" >&2; exit 2 ;;
            esac
            chmod 600 "$recipient_file"
            trap 'rm -f -- "$recipient_file"' EXIT

            backend_id="$(docker-compose ps -q backend)"
            test -n "$backend_id"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$backend_id")" = "healthy"

            if [ "$operation" = "send" ]; then
              docker exec -i "$backend_id" python -m scripts.remind_event_accounts \
                --recipient-file - \
                --send-reminders \
                --commit \
                --confirm-event duquantum-2026 \
                --expected-recipient-count "$expected_recipient_count" \
                --expected-setup-count "$expected_setup_count" \
                --expected-signin-count "$expected_signin_count" \
                --expected-recipient-sha256 "$expected_recipient_sha256" \
                < "$recipient_file"
            else
              docker exec -i "$backend_id" python -m scripts.remind_event_accounts \
                --recipient-file - < "$recipient_file"
            fi
          EOF
