name: Import DuQuantum Final Teams

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate is database read-only; commit publishes the final teams
        required: true
        default: validate
        type: choice
        options:
          - validate
          - commit
      confirm_event:
        description: Type duquantum-2026 to confirm the protected team operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: duquantum-final-team-import
  cancel-in-progress: false

jobs:
  import-final-teams:
    name: Validate and import the protected final teams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate operator confirmation
        env:
          CONFIRM_EVENT: ${{ inputs.confirm_event }}
          TEAMS_B64_PART_1: ${{ secrets.DUQUANTUM_FINAL_TEAMS_XLSX_B64_PART_1 }}
          TEAMS_B64_PART_2: ${{ secrets.DUQUANTUM_FINAL_TEAMS_XLSX_B64_PART_2 }}
        run: |
          set -euo pipefail
          test "$CONFIRM_EVENT" = "duquantum-2026"
          test -n "$TEAMS_B64_PART_1"
          test -n "$TEAMS_B64_PART_2"

      - name: Reconstruct and validate the final workbook
        env:
          TEAMS_B64_PART_1: ${{ secrets.DUQUANTUM_FINAL_TEAMS_XLSX_B64_PART_1 }}
          TEAMS_B64_PART_2: ${{ secrets.DUQUANTUM_FINAL_TEAMS_XLSX_B64_PART_2 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/duquantum-final-teams"
          printf '%s%s' "$TEAMS_B64_PART_1" "$TEAMS_B64_PART_2" \
            | base64 --decode \
            > "$RUNNER_TEMP/duquantum-final-teams/final-teams.xlsx"
          echo "91611e9aae4b3395368e443ba2701cdf8fabd9dd219004317a0ddf67b5369eef  $RUNNER_TEMP/duquantum-final-teams/final-teams.xlsx" \
            | sha256sum --check --strict
          python -m pip install --disable-pip-version-check --quiet openpyxl==3.1.5
          python portal-backend-python/scripts/import_event_teams.py \
            --input "$RUNNER_TEMP/duquantum-final-teams/final-teams.xlsx" \
            --expect-source-sha256 91611e9aae4b3395368e443ba2701cdf8fabd9dd219004317a0ddf67b5369eef \
            --expect-master-rows 219 \
            --expect-team-rows 61 \
            --expect-teams 61 \
            --expect-members 219

      - name: Store the source and run the database operation
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_USER: ec2-user
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          trap 'rm -f key.pem; rm -rf "$RUNNER_TEMP/duquantum-final-teams"' EXIT
          printf '%s' "$PRIVATE_KEY" > key.pem
          chmod 600 key.pem

          remote_xlsx="duquantum-final-teams-${GITHUB_RUN_ID}.xlsx"
          scp -i key.pem -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/duquantum-final-teams/final-teams.xlsx" \
            "$EC2_USER@$EC2_IP:~/$remote_xlsx"

          ssh -i key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_IP" \
            bash -s -- "$OPERATION" "$remote_xlsx" << 'EOF'
            set -euo pipefail
            operation="$1"
            remote_xlsx="$2"
            source_xlsx="$HOME/$remote_xlsx"
            private_dir="$HOME/data/private/duquantum-2026"
            container_xlsx="/tmp/$remote_xlsx"
            backend_id=""
            cleanup() {
              rm -f -- "$source_xlsx"
              if [ -n "$backend_id" ]; then
                docker exec "$backend_id" rm -f -- "$container_xlsx" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup EXIT

            install -d -m 700 "$private_dir"
            install -m 600 "$source_xlsx" "$private_dir/final_teams.xlsx"

            backend_id="$(docker-compose ps -q backend)"
            test -n "$backend_id"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$backend_id")" = "healthy"
            docker cp "$source_xlsx" "$backend_id:$container_xlsx"

            common_args="--input $container_xlsx --expect-source-sha256 91611e9aae4b3395368e443ba2701cdf8fabd9dd219004317a0ddf67b5369eef --expect-master-rows 219 --expect-team-rows 61 --expect-teams 61 --expect-members 219 --expect-matched 150 --expect-unmatched 69 --expect-ambiguous 0"
            if [ "$operation" = "commit" ]; then
              docker exec "$backend_id" sh -c \
                "python -m scripts.import_event_teams $common_args --commit --confirm-event duquantum-2026"
            else
              docker exec "$backend_id" sh -c \
                "python -m scripts.import_event_teams $common_args --database-check"
            fi
          EOF

      - name: Record safe completion summary
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo "### DuQuantum final-team operation"
            echo ""
            echo "- Operation: $OPERATION"
            echo "- Final teams: 61"
            echo "- Final team members: 219"
            echo "- Portal-linked members: 150"
            echo "- Unlinked workbook members retained: 69"
            echo "- Source workbook retained privately on the application host"
          } >> "$GITHUB_STEP_SUMMARY"
