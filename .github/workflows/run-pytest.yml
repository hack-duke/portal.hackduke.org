name: Run Unit Tests via Pytest

on:
  pull_request:

jobs:
  changes:
    name: Pytest Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'portal-backend-python/**/*.py'
              - 'portal-backend-python/pyproject.toml'
              - 'portal-backend-python/poetry.lock'
              - 'portal-backend-python/tests/**'

  tests:
    name: Run Pytest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portal-backend-python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --with dev

      - name: Test with pytest
        run: poetry run coverage run -m pytest -v -s

      - name: Generate Coverage Report
        run: poetry run coverage report -m
