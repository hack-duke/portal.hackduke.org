name: Configure DuQuantum Email Authentication

on:
  workflow_dispatch:
    inputs:
      confirm_event:
        description: Type duquantum-2026
        required: true
        type: string
      send_reminders:
        description: Send the protected pending-account batch after SES verification and a fresh inventory
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: duquantum-email-authentication
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate event
        env:
          CONFIRM_EVENT: ${{ inputs.confirm_event }}
        run: test "$CONFIRM_EVENT" = duquantum-2026
      - name: Configure and report SES authentication in production
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_IP: ${{ secrets.EC2_IP }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f -- key.pem' EXIT
          printf '%s' "$PRIVATE_KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no "ec2-user@$EC2_IP" bash -s << 'REMOTE'
          set -euo pipefail
          backend_id="$(docker-compose ps -q backend)"
          test -n "$backend_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$backend_id")" = healthy
          docker exec -i "$backend_id" python - << 'PY'
          import json
          import time
          from botocore.exceptions import ClientError
          from services.event_email_campaign import SesSettings, SesEmailSender
          from scripts.remind_event_accounts import validate_ses_delivery_posture
          settings = SesSettings.from_environment()
          client = SesEmailSender(settings).client
          for identity in ('hackduke.org', 'hackers@hackduke.org'):
              try:
                  client.put_email_identity_dkim_attributes(EmailIdentity=identity, SigningEnabled=True)
                  print('DKIM enabled:', identity)
              except ClientError as error:
                  print('DKIM configuration error:', identity, error.response['Error']['Code'])
              state = client.get_email_identity(EmailIdentity=identity)
              print(json.dumps({'identity': identity, 'verification': state.get('VerificationStatus'), 'dkim': state.get('DkimAttributes'), 'mail_from': state.get('MailFromAttributes')}, default=str))
          account = client.get_account()
          print(json.dumps({key: account.get(key) for key in ('SendingEnabled', 'ProductionAccessEnabled', 'SuppressionAttributes', 'EnforcementStatus')}))
          for attempt in range(120):
              try:
                  posture = validate_ses_delivery_posture(client, settings)
              except RuntimeError as error:
                  print('Waiting for SES verification:', str(error), flush=True)
                  if attempt == 119:
                      raise SystemExit('SES verification is still pending after 60 minutes')
                  time.sleep(30)
              else:
                  print('SES posture:', json.dumps(posture), flush=True)
                  break
          PY
          REMOTE

  remind:
    needs: configure
    if: ${{ inputs.send_reminders }}
    runs-on: ubuntu-latest
    concurrency:
      group: duquantum-account-reminders
      cancel-in-progress: false
    steps:
      - name: Inventory and send the protected pending-account batch
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_IP: ${{ secrets.EC2_IP }}
          RECIPIENT_EMAILS: ${{ secrets.DUQUANTUM_INCOMPLETE_ACCOUNT_EMAILS }}
        run: |
          set -euo pipefail
          test -n "$RECIPIENT_EMAILS"
          umask 077
          local_recipients="$(mktemp)"
          remote_recipients=".duquantum-reminders-${GITHUB_RUN_ID}.txt"
          trap 'rm -f -- key.pem "$local_recipients"' EXIT
          printf '%s' "$PRIVATE_KEY" > key.pem
          printf '%s\n' "$RECIPIENT_EMAILS" > "$local_recipients"
          scp -i key.pem -o StrictHostKeyChecking=no "$local_recipients" "ec2-user@$EC2_IP:$remote_recipients"
          ssh -i key.pem -o StrictHostKeyChecking=no "ec2-user@$EC2_IP" bash -s -- "$remote_recipients" << 'REMOTE'
          set -euo pipefail
          recipient_file="$1"
          case "$recipient_file" in
            .duquantum-reminders-*.txt) ;;
            *) exit 2 ;;
          esac
          chmod 600 "$recipient_file"
          trap 'rm -f -- "$recipient_file"' EXIT
          backend_id="$(docker-compose ps -q backend)"
          test -n "$backend_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$backend_id")" = healthy
          inventory="$(docker exec -i "$backend_id" python -m scripts.remind_event_accounts --recipient-file - < "$recipient_file")"
          printf '%s\n' "$inventory"
          count="$(printf '%s\n' "$inventory" | sed -n 's/^Exact recipients requested: //p')"
          setup="$(printf '%s\n' "$inventory" | sed -n 's/^Fresh setup-link reminders planned: //p')"
          signin="$(printf '%s\n' "$inventory" | sed -n 's/^Existing-account sign-in reminders planned: //p')"
          fingerprint="$(printf '%s\n' "$inventory" | sed -n 's/^Recipient set SHA-256: //p')"
          for value in "$count" "$setup" "$signin"; do
            printf '%s' "$value" | grep -Eq '^[0-9]+$'
          done
          printf '%s' "$fingerprint" | grep -Eq '^[0-9a-f]{64}$'
          docker exec -i "$backend_id" python -m scripts.remind_event_accounts \
            --recipient-file - --send-reminders --commit --confirm-event duquantum-2026 \
            --expected-recipient-count "$count" --expected-setup-count "$setup" \
            --expected-signin-count "$signin" --expected-recipient-sha256 "$fingerprint" < "$recipient_file"
          REMOTE
